# -----------------------------------------------------------------------------
# PERSONAL FINANCE TRACKER
# GITHUB PAGES DEPLOYMENT
# -----------------------------------------------------------------------------
#
# Repository structure:
#
# Expense-Tracker/
# └── personal-finance-tracker/
#     ├── frontend/
#     ├── google-apps-script/
#     ├── docs/
#     └── ...
#
# Therefore all frontend paths below intentionally start with:
#
#     personal-finance-tracker/frontend
#
# -----------------------------------------------------------------------------

name: Deploy Finance Tracker

# -----------------------------------------------------------------------------
# WORKFLOW TRIGGERS
# -----------------------------------------------------------------------------

on:

  # Automatically run whenever changes are pushed to main.
  push:
    branches:
      - main

  # Allows manual execution from GitHub Actions.
  workflow_dispatch:

# -----------------------------------------------------------------------------
# GITHUB PERMISSIONS
# -----------------------------------------------------------------------------

permissions:
  contents: read
  pages: write
  id-token: write

# -----------------------------------------------------------------------------
# DEPLOYMENT CONCURRENCY
# -----------------------------------------------------------------------------

concurrency:
  group: pages
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------

jobs:

  # ===========================================================================
  # BUILD
  # ===========================================================================

  build:

    # GitHub-hosted Ubuntu machine.
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # STEP 1 - CHECKOUT REPOSITORY
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2 - SETUP NODE.JS
      # -----------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------------------------------------------------
      # STEP 3 - INSTALL FRONTEND DEPENDENCIES
      # -----------------------------------------------------------------------
      #
      # IMPORTANT:
      #
      # The frontend is NOT at:
      #
      #     ./frontend
      #
      # It is at:
      #
      #     ./personal-finance-tracker/frontend
      #
      # -----------------------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: personal-finance-tracker/
        run: npm install --no-audit --no-fund

      # -----------------------------------------------------------------------
      # STEP 4 - BUILD FRONTEND
      # -----------------------------------------------------------------------

      - name: Build frontend
        working-directory: personal-finance-tracker/
        env:

          # GitHub repository name.
          #
          # Example:
          #
          # Repository = Expense-Tracker
          #
          # Vite base path becomes:
          #
          # /Expense-Tracker/
          #
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

          # Google Apps Script Web App URL.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

          # Google Apps Script API token.
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}

        run: npm run build

      # -----------------------------------------------------------------------
      # STEP 5 - CREATE SPA FALLBACK
      # -----------------------------------------------------------------------
      #
      # React Router needs a fallback when GitHub Pages receives a direct
      # request for routes such as:
      #
      #     /transactions
      #     /reports
      #     /manage
      #
      # -----------------------------------------------------------------------

      - name: Create GitHub Pages SPA fallback
        working-directory: personal-finance-tracker/
        run: cp dist/index.html dist/404.html

      # -----------------------------------------------------------------------
      # STEP 6 - CONFIGURE GITHUB PAGES
      # -----------------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------------------------
      # STEP 7 - UPLOAD FRONTEND BUILD
      # -----------------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:

          # IMPORTANT:
          # The Vite production build is here.
          path: personal-finance-tracker/dist

  # ===========================================================================
  # DEPLOY
  # ===========================================================================

  deploy:

    # Only deploy if the build succeeds.
    needs: build

    # GitHub Pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Ubuntu deployment machine.
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # DEPLOY TO GITHUB PAGES
      # -----------------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4