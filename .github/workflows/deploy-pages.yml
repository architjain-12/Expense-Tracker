# -----------------------------------------------------------------------------
# PERSONAL FINANCE TRACKER
# GITHUB PAGES DEPLOYMENT
# -----------------------------------------------------------------------------
#
# This workflow builds the React/Vite frontend and deploys it to GitHub Pages.
#
# It runs automatically whenever code is pushed to the main branch.
# It can also be started manually from GitHub Actions.
# -----------------------------------------------------------------------------

name: Deploy Finance Tracker

# -----------------------------------------------------------------------------
# WORKFLOW TRIGGERS
# -----------------------------------------------------------------------------

on:

  # Run whenever code is pushed to the main branch.
  push:
    branches:
      - main

  # Allow manual execution from:
  #
  # GitHub
  #   -> Actions
  #      -> Deploy Finance Tracker
  #         -> Run workflow
  #
  workflow_dispatch:

# -----------------------------------------------------------------------------
# GITHUB PERMISSIONS
# -----------------------------------------------------------------------------

permissions:
  # Allows the workflow to read repository contents.
  contents: read

  # Required for GitHub Pages deployment.
  pages: write

  # Required by GitHub Pages deployment.
  id-token: write

# -----------------------------------------------------------------------------
# CONCURRENCY
# -----------------------------------------------------------------------------
#
# Prevent multiple GitHub Pages deployments from running simultaneously.
# -----------------------------------------------------------------------------

concurrency:
  group: pages
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------

jobs:

  # ===========================================================================
  # BUILD JOB
  # ===========================================================================

  build:

    # GitHub provides an Ubuntu virtual machine.
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # STEP 1 - CHECKOUT SOURCE CODE
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2 - SETUP NODE.JS
      # -----------------------------------------------------------------------
      #
      # IMPORTANT:
      # We intentionally do NOT enable npm caching here.
      #
      # The current project does not have package-lock.json yet.
      #
      # Once package-lock.json is committed, we can safely add:
      #
      #     cache: npm
      #
      # -----------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------------------------------------------------
      # STEP 3 - INSTALL FRONTEND DEPENDENCIES
      # -----------------------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # -----------------------------------------------------------------------
      # STEP 4 - BUILD FRONTEND
      # -----------------------------------------------------------------------
      #
      # VITE_BASE_PATH tells Vite where the application will be hosted.
      #
      # For example, if the GitHub repository is:
      #
      #     personal-finance-tracker
      #
      # GitHub Pages will host it at:
      #
      #     /personal-finance-tracker/
      #
      # -----------------------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        env:

          # Automatically determine the repository name.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

          # Google Apps Script Web App URL.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

          # Apps Script API token.
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}

        run: npm run build

      # -----------------------------------------------------------------------
      # STEP 5 - CREATE GITHUB PAGES SPA FALLBACK
      # -----------------------------------------------------------------------
      #
      # Your application uses React Router.
      #
      # GitHub Pages doesn't automatically understand routes such as:
      #
      #     /transactions
      #     /reports
      #     /manage
      #
      # Creating 404.html from index.html allows the React application to
      # handle those routes.
      # -----------------------------------------------------------------------

      - name: Create GitHub Pages SPA fallback
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      # -----------------------------------------------------------------------
      # STEP 6 - CONFIGURE GITHUB PAGES
      # -----------------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # -----------------------------------------------------------------------
      # STEP 7 - UPLOAD BUILD ARTIFACT
      # -----------------------------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # ===========================================================================
  # DEPLOY JOB
  # ===========================================================================

  deploy:

    # Wait for the build job to complete successfully.
    needs: build

    # GitHub Pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Use Ubuntu for deployment.
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # DEPLOY TO GITHUB PAGES
      # -----------------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4